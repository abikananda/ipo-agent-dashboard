services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ipo_analysis
      MYSQL_USER: ipo_user
      MYSQL_PASSWORD: ipo_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost"], interval: 5s, timeout: 5s, retries: 20}
  backend:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ipo_analysis?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ipo_user
      DB_PASSWORD: ipo_password
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      IPO_AI_PROVIDER: ${IPO_AI_PROVIDER:-disabled}
      IPO_AI_BASE_URL: ${IPO_AI_BASE_URL:-http://host.docker.internal:11434}
      IPO_AI_MODEL: ${IPO_AI_MODEL:-llama3.2:3b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8080:8080"]
    depends_on: {mysql: {condition: service_healthy}}
  frontend:
    build: frontend
    ports: ["4200:80"]
    depends_on: [backend]
volumes: {mysql_data: {}}
