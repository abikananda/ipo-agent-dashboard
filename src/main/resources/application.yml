spring:
  application.name: ipo-analysis-agent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ipo_analysis?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ipo_user}
    password: ${DB_PASSWORD:ipo_password}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
management.endpoints.web.exposure.include: health,info,metrics
springdoc.swagger-ui.path: /swagger-ui.html
ipo:
  sources:
    sebi-url: ${IPO_SEBI_FEED_URL:}
    nse-url: ${IPO_NSE_FEED_URL:}
    bse-url: ${IPO_BSE_FEED_URL:}
  documents:
    allowed-hosts: ${IPO_DOCUMENT_ALLOWED_HOSTS:sebi.gov.in,www.sebi.gov.in,nseindia.com,www.nseindia.com,bseindia.com,www.bseindia.com}
  schedules:
    discovery: ${IPO_DISCOVERY_CRON:0 0 */6 * * *}
  ai:
    provider: ${IPO_AI_PROVIDER:disabled}
    base-url: ${IPO_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${IPO_AI_API_KEY:}
    model: ${IPO_AI_MODEL:gpt-5-mini}
resilience4j.retry.instances.ipoSource:
  max-attempts: 3
  wait-duration: 2s
